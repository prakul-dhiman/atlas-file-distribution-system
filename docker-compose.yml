services:

  postgres:
    image: postgres:16-alpine
    container_name: sdfds-postgres
    environment:
      POSTGRES_DB: sdfds_db
      POSTGRES_USER: sdfds_user
      POSTGRES_PASSWORD: sdfds_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdfds_user -d sdfds_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sdfds-network

  redis:
    image: redis:7-alpine
    container_name: sdfds-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sdfds-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sdfds-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sdfds_db
      SPRING_DATASOURCE_USERNAME: sdfds_user
      SPRING_DATASOURCE_PASSWORD: sdfds_password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sdfds-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sdfds-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - sdfds-network

networks:
  sdfds-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
