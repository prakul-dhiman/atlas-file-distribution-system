spring:
  application:
    name: sdfds-backend-test

  datasource:
    url: jdbc:h2:mem:sdfds_testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6379

storage:
  chunk-size-bytes: 8388608
  replication-factor: 2
  direct-upload-max-bytes: 104857600
  max-file-size-bytes: 5368709120

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  access-token-ttl-ms: 900000
  refresh-token-ttl-ms: 604800000
